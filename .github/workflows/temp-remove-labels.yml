name: Temp Remove Labels

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3735,
              labels: []
            });
