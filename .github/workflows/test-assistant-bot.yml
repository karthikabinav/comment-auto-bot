name: Automated Comment Bot
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            let message = "Thank you for your contribution!";
            if (labels.includes("bug")) { message = "Thank you. We will fix it"; } else if (labels.includes("feature")) { message = "Thank you, we will consider to include this feature."; }
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: message});
