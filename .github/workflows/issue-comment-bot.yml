name: Issue Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment-on-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Add a contextual comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = (context.payload.issue.labels || []).map((label) =>
              (typeof label === 'string' ? label : label.name).toLowerCase()
            );

            let body = 'Thank you for your contribution!';
            if (labels.includes('bug')) {
              body = 'Thank you. We will fix it';
            } else if (labels.includes('feature')) {
              body = 'Thank you, we will consider to include this feature.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
