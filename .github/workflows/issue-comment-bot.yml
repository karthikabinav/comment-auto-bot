name: Issue Comment Bot

on:
  issues:
    types:
      - opened
      - labeled

permissions:
  issues: write

concurrency:
  group: issue-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  comment-on-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Add a contextual comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = (context.payload.issue.labels || []).map((label) =>
              (typeof label === 'string' ? label : label.name).toLowerCase()
            );

            let commentBody = 'Thank you for your contribution!';
            if (labels.includes('bug')) {
              commentBody = 'Thank you. We will fix it';
            } else if (labels.includes('feature')) {
              commentBody = 'Thank you, we will consider to include this feature.';
            }

            const knownReplies = new Set([
              'Thank you. We will fix it',
              'Thank you, we will consider to include this feature.',
              'Thank you for your contribution!'
            ]);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              per_page: 100
            });

            const alreadyCommented = comments.some((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              knownReplies.has((comment.body || '').trim())
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: commentBody
              });
            }
