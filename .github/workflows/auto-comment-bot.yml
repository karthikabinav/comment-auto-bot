name: Automated Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post a comment based on the issue label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.issue.labels || []).map((label) => label.name);

            let message;
            if (labels.includes("bug")) {
              message = "Thank you. We will fix it";
            } else if (labels.includes("feature")) {
              message = "Thank you, we will consider to include this feature.";
            } else {
              // No label assigned (or no recognised label)
              message = "Thank you for your contribution!";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: message,
            });
