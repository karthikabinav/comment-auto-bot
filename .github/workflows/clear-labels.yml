name: Clear Labels
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true
        type: string
permissions:
  issues: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.setLabels({owner: context.repo.owner, repo: context.repo.repo, issue_number: parseInt(context.payload.inputs.issue_number), labels: []});
