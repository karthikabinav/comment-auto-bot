name: Automated Comment Bot

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to test
        required: true
        type: string
      clear_labels:
        description: Remove all labels before testing the no-label response
        required: false
        default: false
        type: boolean

permissions:
  issues: write

concurrency:
  group: comment-auto-bot-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment based on issue labels
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CLEAR_LABELS: ${{ inputs.clear_labels }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const manual = context.eventName === "workflow_dispatch";
            const issue_number = manual
              ? Number(process.env.ISSUE_NUMBER)
              : context.payload.issue.number;
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) {
              throw new Error("A valid issue number is required.");
            }
            if (manual && process.env.CLEAR_LABELS === "true") {
              await github.rest.issues.removeAllLabels({ owner, repo, issue_number });
            }
            const issue = manual
              ? (await github.rest.issues.get({ owner, repo, issue_number })).data
              : context.payload.issue;
            const labels = issue.labels.map(label =>
              typeof label === "string" ? label : label.name);
            let body = "Thank you for your contribution!";
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature.";
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const alreadyCommented = comments.some(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body === body);
            if (!alreadyCommented) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            core.info(`Expected response: ${body}`);
