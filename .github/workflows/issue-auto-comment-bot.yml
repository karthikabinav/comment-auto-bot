name: Issue Auto Comment Bot
on:
  issues:
    types: [opened, labeled]
permissions:
  issues: write
jobs:
  auto-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post a label-aware reply on new issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;

            // Give labels applied right after creation a moment to land.
            await new Promise(resolve => setTimeout(resolve, 5000));

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name));

            let body = "Thank you for your contribution!";
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature.";
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const alreadyPosted = comments.some(c => (c.body || "").trim() === body);
            if (alreadyPosted) {
              core.info("Reply already present, skipping duplicate comment.");
              return;
            }

            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info(`Commented on #${issue_number}: ${body}`);
