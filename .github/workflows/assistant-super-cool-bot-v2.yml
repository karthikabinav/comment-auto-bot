name: Automated Comment Bot
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add comment based on label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name.toLowerCase());
            let body = "Thank you for your contribution!";
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature.";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });