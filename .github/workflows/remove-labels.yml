name: Remove Labels

on:
  issues:
    types: [edited]

permissions:
  issues: write

jobs:
  remove:
    if: github.event.issue.number == 69
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.html_url }}
        run: |
          gh issue edit $ISSUE --remove-label "security,critical"
