name: Issue Auto Comment Bot

on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: string

permissions:
  issues: write

jobs:
  comment-on-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Add comment based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const inputIssueNumber = context.payload.inputs?.issue_number;
            const issueNumber = inputIssueNumber ? Number(inputIssueNumber) : context.issue.number;

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = (issue.labels || []).map((label) => {
              return (typeof label === 'string' ? label : label.name).toLowerCase();
            });

            let body = null;
            if (labels.includes('bug')) {
              body = 'Thank you. We will fix it';
            } else if (labels.includes('feature')) {
              body = 'Thank you, we will consider to include this feature.';
            } else if (labels.length === 0) {
              body = 'Thank you for your contribution!';
            }

            if (!body) {
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const alreadyExists = comments.some((comment) => {
              return comment.user?.login === 'github-actions[bot]' && comment.body === body;
            });

            if (alreadyExists) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
