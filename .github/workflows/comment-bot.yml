name: Comment Auto Bot
on:
  issues:
    types: [opened]
jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            let body;
            if (labels.includes('apos;bug'apos;)) {
              body = 'apos;Thank you. We will fix it'apos;;
            } else if (labels.includes('apos;feature'apos;)) {
              body = 'apos;Thank you, we will consider to include this feature.'apos;;
            } else {
              body = 'apos;Thank you for your contribution!'apos;;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: body
            });
