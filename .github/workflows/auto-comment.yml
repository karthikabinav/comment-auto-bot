name: Automated Comment Bot

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to test
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: auto-comment-yml-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reply according to issue labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue?.number ?? Number(context.payload.inputs?.issue_number);
            if (!Number.isSafeInteger(issueNumber) || issueNumber <= 0) {
              throw new Error("A valid positive issue number is required.");
            }
            const issue = { ...context.repo, issue_number: issueNumber };
            const issueData = context.payload.issue ?? (await github.rest.issues.get(issue)).data;
            const labels = issueData.labels.map(label => typeof label === "string" ? label : label.name);
            let body;
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature.";
            } else if (labels.length === 0) {
              body = "Thank you for your contribution!";
            } else {
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue,
              per_page: 100
            });
            if (comments.some(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body === body
            )) {
              core.info("A matching bot reply already exists.");
              return;
            }
            await github.rest.issues.createComment({ ...issue, body });
