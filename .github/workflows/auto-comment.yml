name: Automated Issue Comments
on:
  issues:
    types: [opened]

jobs:
  add-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on new issue based on label
        uses: actions/github-script@v6
        with:
          script: |
            const labels = context.payload.issue.labels.map(label => label.name);
            let commentBody = "Thank you for your contribution!";
            if (labels.includes("bug")) {
              commentBody = "Thank you. We will fix it";
            } else if (labels.includes("feature")) {
              commentBody = "Thank you, we will consider to include this feature.";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
