name: Auto Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-auto-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add comment based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(label => label.name);
            let commentBody = "Thank you for your contribution!";

            if (labels.includes("bug")) {
              commentBody = "Thank you. We will fix it";
            } else if (labels.includes("feature")) {
              commentBody = "Thank you, we will consider to include this feature.";
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const alreadyCommented = comments.some(comment =>
              comment.user && comment.user.login === "github-actions[bot]" && comment.body === commentBody
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
