name: Auto Comment Bot
on:
  issues:
    types: [opened, labeled]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            // Only comment when opened, or when labeled if it was previously unlabeled?
            // Actually, just trigger on opened for simplicity, or opened.
            const eventName = context.eventName;
            const action = context.payload.action;
            
            // We want to respond based on the labels.
            // If the issue was just opened, we can respond immediately.
            // But sometimes labels are added a second later. 
            // The prompt says "If someone makes an issue with a `bug` label".
            // So checking on `opened` is good.
            
            // To prevent duplicate comments, maybe we check if we already commented?
            // For simplicity, let's just trigger on `opened` to keep it basic.
            if (action !== 'opened') return;
            
            const labels = context.payload.issue.labels.map(l => l.name);
            let body = "Thank you for your contribution!";
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature.";
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
