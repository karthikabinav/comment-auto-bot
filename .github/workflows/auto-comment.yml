name: Automated Comment Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write

concurrency:
  group: auto-comment-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add the appropriate issue comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = (context.payload.issue.labels ?? []).map(label =>
              typeof label === "string" ? label : label.name
            );
            let body;
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature.";
            } else if (labels.length === 0) {
              body = "Thank you for your contribution!";
            } else {
              return;
            }

            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...issue, per_page: 100
            });
            if (comments.some(comment => comment.user?.type === "Bot" && comment.body === body)) {
              core.info("The expected acknowledgement has already been posted.");
              return;
            }
            await github.rest.issues.createComment({ ...issue, body });
