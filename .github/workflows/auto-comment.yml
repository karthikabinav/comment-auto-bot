name: Auto Comment on New Issues

"on":
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to test or retry
        required: true
        type: string

permissions:
  issues: write

concurrency:
  group: issue-comment-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment based on labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.eventName === "workflow_dispatch"
              ? Number(context.payload.inputs.issue_number)
              : context.issue.number;
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) {
              throw new Error("A positive issue number is required.");
            }
            const issue = context.eventName === "workflow_dispatch"
              ? (await github.rest.issues.get({ owner, repo, issue_number })).data
              : context.payload.issue;
            if (issue.pull_request) {
              throw new Error("This workflow only comments on issues.");
            }
            const labels = (issue.labels || []).map(label =>
              typeof label === "string" ? label : label.name
            );
            let body;
            if (labels.includes("bug")) {
              body = "Thank you. We will fix it";
            } else if (labels.includes("feature")) {
              body = "Thank you, we will consider to include this feature.";
            } else if (labels.length === 0) {
              body = "Thank you for your contribution!";
            } else {
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            if (comments.some(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body === body
            )) {
              core.info("The expected bot comment already exists.");
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
